<section class="bab-auth">
  <h1 class="bab-auth-brand">B.A.B</h1>
  <p class="bab-muted bab-auth-tagline">Be A Beast. One day at a time.</p>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <h2>Sign in</h2>

    <mat-form-field>
      <mat-label>Email</mat-label>
      <input matInput type="email" formControlName="email" autocomplete="email" />
      <mat-error>Enter a valid email.</mat-error>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Password</mat-label>
      <input
        matInput
        [type]="showPassword() ? 'text' : 'password'"
        formControlName="password"
        autocomplete="current-password"
      />
      <button
        mat-icon-button
        matSuffix
        type="button"
        (click)="showPassword.set(!showPassword())"
        [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
      >
        <mat-icon>{{ showPassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
      <mat-error>Enter your password.</mat-error>
    </mat-form-field>

    @if (error()) {
      <p class="bab-form-error" role="alert">{{ error() }}</p>
    }

    <button mat-flat-button type="submit" [disabled]="pending()">
      {{ pending() ? 'Signing in...' : 'Sign in' }}
    </button>
  </form>
  <app-google-sign-in (signedIn)="afterGoogle($event)" />

  <p class="bab-muted">
    Forgot your password? Contact the admin to reset it. Signed up with Google? Use the Google
    button.
  </p>
  <p>New here? <a routerLink="/register">Create an account</a></p>
</section>
