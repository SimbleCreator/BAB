<section class="bab-page">
  <h1 class="bab-page-title">Today</h1>

  <mat-card appearance="outlined" class="line">
    <mat-card-content>
      <p class="line-text">Show up first. The results catch up later.</p>
    </mat-card-content>
  </mat-card>

  <mat-card appearance="outlined">
    <mat-card-header>
      <mat-card-title>Server connection</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      @if (health.isLoading()) {
        <div class="status">
          <mat-spinner diameter="24" />
          <span>Checking...</span>
        </div>
      } @else if (health.error()) {
        <div class="status error">
          <mat-icon>cloud_off</mat-icon>
          <span>Cannot reach the server. Is the backend running?</span>
        </div>
        <button mat-button (click)="health.reload()">Try again</button>
      } @else if (health.value(); as h) {
        <div class="status ok">
          <mat-icon>check_circle</mat-icon>
          <span>Connected. API version {{ h.version }}.</span>
        </div>
      }
    </mat-card-content>
  </mat-card>
</section>
