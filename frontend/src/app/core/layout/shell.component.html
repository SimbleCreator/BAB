<div class="shell" [class.bare]="!showNav()">
  @if (showNav()) {
    <header class="topbar">
      <a class="brand" routerLink="/home" aria-label="B.A.B home">
        <span class="mark">B</span>
        <span class="word">B.A.B</span>
      </a>
      <button
        type="button"
        class="avatar"
        (click)="toggleSheet()"
        aria-label="Open menu"
        [attr.aria-expanded]="sheetOpen()"
      >
        {{ initial() }}
      </button>
    </header>
  }

  <main class="content">
    <router-outlet />
  </main>

  @if (showNav()) {
    <nav class="dock" aria-label="Main">
      <a
        #bounceKey
        class="bounce-key"
        routerLink="/bounce"
        routerLinkActive="active"
        #bla="routerLinkActive"
        [attr.aria-current]="bla.isActive ? 'page' : null"
        [attr.aria-label]="
          mascot()?.note() ? 'Bounce, your AI coach: 1 new message' : 'Bounce, your AI coach'
        "
        (click)="close()"
      >
        <span class="cap">
          <app-bounce-ball
            class="key-ball"
            [class.away]="mascot()?.away()"
            [buff]="mascot()?.keyBuff() ?? false"
          />
          <span class="key-label">Bounce</span>
        </span>
        @if (mascot()?.note() && !mascot()?.noteOpen()) {
          <span class="badge" aria-hidden="true"></span>
        }
      </a>
      @for (item of primaryNav; track item.path) {
        <a
          class="tab"
          [routerLink]="item.path"
          routerLinkActive="active"
          #rla="routerLinkActive"
          [attr.aria-current]="rla.isActive ? 'page' : null"
          (click)="close()"
        >
          <mat-icon>{{ item.icon }}</mat-icon>
          <span>{{ item.label }}</span>
        </a>
      }
      <button
        type="button"
        class="tab"
        [class.active]="moreActive()"
        (click)="toggleSheet()"
        [attr.aria-expanded]="sheetOpen()"
        aria-controls="more-sheet"
      >
        <mat-icon>{{ sheetOpen() ? 'close' : 'apps' }}</mat-icon>
        <span>More</span>
      </button>
    </nav>

    @if (sheetOpen()) {
      <div class="scrim" (click)="close()" aria-hidden="true"></div>
      <section
        id="more-sheet"
        class="sheet"
        role="dialog"
        aria-modal="true"
        aria-label="More"
        cdkTrapFocus
        [cdkTrapFocusAutoCapture]="true"
      >
        <div class="handle" aria-hidden="true"></div>
        <div class="sheet-head">
          <h2>Where to next?</h2>
          <button type="button" class="close" (click)="close()" aria-label="Close menu">
            <mat-icon>close</mat-icon>
          </button>
        </div>
        <app-more-tiles (picked)="close()" />
      </section>
    }

    <app-bounce-mascot [anchor]="bounceKey" />
  }
</div>
