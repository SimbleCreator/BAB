# Keeps the free Render API from going to sleep (it sleeps after about 15 minutes with
# no requests, and the next visitor then waits up to a minute while it starts).
#
# - Calls only the health check, which does not touch the database, so Neon still
#   pauses when idle and uses no extra compute.
# - One always-on free Render service uses about 744 of the 750 free hours a month.
#   With a second free service on Render the hours would run out: delete this file then.
# - GitHub may run scheduled jobs late at busy times and pauses them after 60 days with
#   no pushes to the repository (re-enable it under Actions).
name: Keep API awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the health check
        run: |
          curl --silent --show-error --output /dev/null --write-out "%{http_code} in %{time_total}s\n" \
            --max-time 120 --retry 3 --retry-delay 20 --retry-all-errors \
            https://bab-api-3wrk.onrender.com/api/v1/health || echo "API did not answer; next ping in 10 minutes."
